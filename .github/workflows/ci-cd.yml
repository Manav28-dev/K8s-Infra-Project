name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/notes-app" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        shell: bash
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./app

      - name: Push image
        shell: bash
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Apply base manifests
        shell: bash
        run: kubectl apply -k k8s/

      - name: Deploy new image
        shell: bash
        run: kubectl set image deployment/backend backend="$IMAGE:${{ github.sha }}" -n notes

      - name: Wait for rollout
        shell: bash
        # 2 replicas update sequentially (maxSurge:1, maxUnavailable:0 is the
        # k8s default at this replica count), and each pod's startupProbe can
        # take up to ~90s to pass on this machine's CPU-limited containers -
        # 180s wasn't enough headroom for two of those back to back.
        run: kubectl rollout status deployment/backend -n notes --timeout=420s
