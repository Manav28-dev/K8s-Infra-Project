# DEMO SIMPLIFICATION: credentials are committed in plaintext (stringData) so the
# whole stack applies with one command out of the box. In a real environment this
# would come from a secret manager (Vault, AWS Secrets Manager, sealed-secrets /
# external-secrets-operator) and never be checked into git. Called out explicitly
# in the tradeoffs section of the README.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: notes
type: Opaque
stringData:
  POSTGRES_DB: notesdb
  POSTGRES_USER: notesuser
  POSTGRES_PASSWORD: supersecretpassword123
